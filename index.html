<!doctype html>
<html lang="en" class="ahimsa-day" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Settled makes no network requests at all, and connect-src 'none' is what makes that a
      rule rather than a habit: nothing it holds can be sent anywhere, however the code
      changes. style-src allows inline because the app styles elements by attribute.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Settled</title>
    <meta name="description" content="A pocket decision coach. Tell it what you're deciding, and it walks you through one proven method, so you can decide and move on. Offline, on your own device, with no accounts and no servers." />
    <meta name="theme-color" content="#fdeedb" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Settled" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./_ahimsa/ahimsa.css" />
    <link rel="preload" href="./_ahimsa/fonts/Fraunces-Italic-VariableFont.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./_ahimsa/fonts/DMSans-VariableFont.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Inline, so it still holds if the stylesheet is the thing that failed to load. The
      policy above allows inline style and forbids inline script, which is why the boot
      fallback is done this way round: CSS shows it, and the app mounting hides it.
    -->
    <style>
      #boot-fallback {
        max-width: 34em; margin: 0 auto; padding: 18vh 24px 24px;
        font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.55;
        color: #4a3f35; background: #fdeedb; min-height: 100vh; box-sizing: border-box;
      }
      #boot-fallback p { margin: 0 0 14px; }
      #app:not(:empty) ~ #boot-fallback { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown only while #app is empty, which means the app never mounted: the script did not
         load, or a stale copy of this page asked for a file that is no longer there. Plain
         HTML and CSS on purpose, because the content security policy forbids inline script,
         and because whatever went wrong may have taken the script with it. -->
    <div id="boot-fallback">
      <p><strong>Settled could not finish loading.</strong></p>
      <p>This usually means the browser is holding an out of date copy of the page. Reload,
        and if it keeps happening, close Settled and open it again.</p>
      <p>Everything is on this device. Nothing here was lost; the app holds its data locally.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
